image: maven:3-jdk-8

.initial_setup: &initial_setup
  before_script:
    - sed -i '/jessie-updates/d' /etc/apt/sources.list
    - apt-get -o Acquire::Check-Valid-Until=false update
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p /root/.ssh
    - '[[ -f /.dockerenv ]] && echo "$SSH_SERVER_HOSTKEYS" > /root/.ssh/known_hosts'
    - echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_rsa
    - chmod 600 /root/.ssh/id_rsa && chmod 700 /root/.ssh
    - apt-get update -qq
    - apt-get install -y -qq sshpass
    - apt-get install -y -qq git
    - sshpass -V

stages:
  - build
  - deploy

build-development:
  stage: build
  <<: *initial_setup
  variables:
    SERVER_PORT: $DEV_SERVER_PORT
    DB_HOST: $DEV_DB_HOST
    DB_PORT: $DEV_DB_PORT
    DB_USER: $DEV_DB_USER
    DB_PASSWORD: $DEV_DB_PASSWORD
    DB_NAME: $DEV_DB_NAME
    SSHPASS: $DEV_USER_PASS
    KEY: $DEV_KEY
    S3_ACCESS_KEY: $DEV_S3_ACCESS_KEY
    S3_SECRET_KEY: $DEV_S3_SECRET_KEY
    S3_BUCKET: $DEV_S3_BUCKET
    S3_REGION: $DEV_S3_REGION
    USERNAME: $DEV_USERNAME
    SECRET_KEY: $DEV_SECRET_KEY
    FORGOT_PASSWORD_URL: $DEV_FORGOT_PASSWORD_URL
    BOOKING_URL: $DEV_BOOKING_URL
    JWT_TOKEN_KEY: $DEV_JWT_TOKEN_KEY
    REDIS_HOST: $DEV_REDIS_HOST
    REDIS_PORT: $DEV_REDIS_PORT
  only:
    - dev
  script:
    - ls
    - mvn package -DskipTests
    - cd target
    - ls
  artifacts:
    paths:
      - .

deploy-development:
  stage: deploy
  <<: *initial_setup
  variables:
    SERVER_PORT: $DEV_SERVER_PORT
    DB_HOST: $DEV_DB_HOST
    DB_PORT: $DEV_DB_PORT
    DB_USER: $DEV_DB_USER
    DB_PASSWORD: $DEV_DB_PASSWORD
    DB_NAME: $DEV_DB_NAME
    KEY: $DEV_KEY
    S3_ACCESS_KEY: $DEV_S3_ACCESS_KEY
    S3_SECRET_KEY: $DEV_S3_SECRET_KEY
    S3_BUCKET: $DEV_S3_BUCKET
    S3_REGION: $DEV_S3_REGION
    USERNAME: $DEV_USERNAME
    SECRET_KEY: $DEV_SECRET_KEY
    FORGOT_PASSWORD_URL: $DEV_FORGOT_PASSWORD_URL
    BOOKING_URL: $DEV_BOOKING_URL
    SERVER_HOST: $DEV_SERVER_HOST
    USER_SSH: $DEV_USER_SSH
    SSHPASS: $DEV_USER_PASS
    JWT_TOKEN_KEY: $DEV_JWT_TOKEN_KEY
    REDIS_HOST: $DEV_REDIS_HOST
    REDIS_PORT: $DEV_REDIS_PORT
  only:
    - dev
  script:
    - sshpass -e scp -o stricthostkeychecking=no -r target/*.jar $USER_SSH@$SERVER_HOST:/var/www/core
    - sshpass -e scp -o stricthostkeychecking=no -r img/*.png $USER_SSH@$SERVER_HOST:/var/www/core/img
    - sshpass -e scp -o stricthostkeychecking=no -r src/main/resources/*.png $USER_SSH@$SERVER_HOST:/var/www/core/resources
    - sshpass -e scp -o stricthostkeychecking=no -r src/main/resources/*.css $USER_SSH@$SERVER_HOST:/var/www/core/resources
    - sshpass -p $SSHPASS ssh $USER_SSH@$SERVER_HOST "export SERVER_PORT=$SERVER_PORT && export DB_HOST=$DB_HOST && export DB_PORT=$DB_PORT && export DB_USER=$DB_USER && export DB_PASSWORD=$DB_PASSWORD && export DB_NAME=$DB_NAME && export KEY=$KEY && export S3_ACCESS_KEY=$S3_ACCESS_KEY && export S3_SECRET_KEY=$S3_SECRET_KEY && export S3_BUCKET=$S3_BUCKET && export S3_REGION=$S3_REGION && export USERNAME=$USERNAME && export SECRET_KEY=$SECRET_KEY && export FORGOT_PASSWORD_URL=$FORGOT_PASSWORD_URL && export BOOKING_URL=$BOOKING_URL && export JWT_TOKEN_KEY=$JWT_TOKEN_KEY && export REDIS_HOST=$REDIS_HOST && export REDIS_PORT=$REDIS_PORT && chmod +x /var/www/core/mospaze*.jar && sh /var/www/core/deploy-mospaze-core.sh"
    - curl -s -X POST https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage -d chat_id=$TELEGRAM_CHAT_ID -d text="[INFO] Dev Core Deployment Successful !!!"
  environment:
    name: development
    url: http://dev.core.mospaze.com
  when: manual

